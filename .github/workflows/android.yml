name: Build Grain Mill APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.1.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-29" "build-tools;29.0.3"

      - name: Extract project
        run: |
          unzip GrainMill.zip -d source
          sed -i 's/ android:exported="true"//' source/GrainMillManager_Compat/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: source/GrainMillManager_Compat
        run: gradle --no-daemon --max-workers=1 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrainMillManager-APK
          path: source/GrainMillManager_Compat/app/build/outputs/apk/debug/app-debug.apk
